<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa">
<meta name="theme-color" content="#1E1924">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Caixa da Laise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — month strip on top, summary card, grouped lists, tab bar fixed at the bottom. */
:root{
  --bg:#F3F1F5; --surface:#FFFFFF; --sunk:#E9E5EE; --fg:#231C2C; --muted:#6E6578; --line:#DDD6E4;
  --gold:#A87618; --gold-soft:#F1E3C4; --gold-ink:#5A3E07;
  --bad:#B8322C; --bad-soft:#F8DEDB; --warn:#A35F00; --warn-soft:#FBE8C8; --ok:#2C7A4F; --ok-soft:#D8EEDF;
  --amei:#7A3E8F; --amei-soft:#EBDDF0;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Manrope", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141118; --surface:#1E1924; --sunk:#29222F; --fg:#F0EAF4; --muted:#A99FB3; --line:#352C3D;
  --gold:#E2B04F; --gold-soft:#3A2D14; --gold-ink:#F5DDA6;
  --bad:#F07A72; --bad-soft:#3D1D1C; --warn:#F0AE52; --warn-soft:#3A2A12; --ok:#6CCB93; --ok-soft:#17301F;
  --amei:#D49AE6; --amei-soft:#35223D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141118; --surface:#1E1924; --sunk:#29222F; --fg:#F0EAF4; --muted:#A99FB3; --line:#352C3D;
  --gold:#E2B04F; --gold-soft:#3A2D14; --gold-ink:#F5DDA6;
  --bad:#F07A72; --bad-soft:#3D1D1C; --warn:#F0AE52; --warn-soft:#3A2A12; --ok:#6CCB93; --ok-soft:#17301F;
  --amei:#D49AE6; --amei-soft:#35223D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px 110px}
h1{font-family:var(--display);font-weight:800;font-size:22px;margin:0;letter-spacing:-.01em}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.top small{color:var(--muted);font-size:12px}
.months{display:flex;gap:6px;overflow-x:auto;padding-block:12px 4px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 13px;font:600 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--bad);margin-left:6px;vertical-align:middle}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:10px;display:grid;gap:12px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-.02em}
.bar{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.split{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.split b{color:var(--fg)}
.gap-line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--bad-soft);color:var(--bad);font-weight:700;font-size:14px}
.gap-line.okay{background:var(--ok-soft);color:var(--ok)}
.linkbtn{background:none;border:0;color:inherit;font:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0}
.group{margin-top:22px}
.group h2{font:700 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between}
.group.late h2{color:var(--bad)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;color:transparent;font-weight:800;padding:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.late .check{border-color:var(--bad)}
.name{min-width:0;cursor:pointer}
.name strong{display:block;font-weight:600;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.amei{background:var(--amei-soft);color:var(--amei)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.val{font-weight:700;text-align:right;white-space:nowrap}
.paid .name strong,.paid .val{color:var(--muted);text-decoration:line-through}
.add{margin-top:16px;width:100%;padding:13px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--fg);font:700 14px var(--body);cursor:pointer}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.tile-btn:hover{border-color:var(--gold)}
.tile .n{font-family:var(--display);font-weight:800;font-size:19px;margin-top:4px;overflow-wrap:anywhere}
.tile.bad .n{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.cards{display:grid;gap:10px}
.card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card-top strong{font-size:16px;overflow-wrap:anywhere}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:8px 12px;font:700 13px var(--body);cursor:pointer}
.btn.primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.gold{background:var(--gold);color:var(--surface);border-color:var(--gold)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.cut .card{opacity:.6}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:16px;padding:22px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:18px;margin-bottom:6px}
.goal{display:grid;gap:8px;padding:14px;border-top:1px solid var(--line)}
.goal:first-child{border-top:0}
.goal-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.goal-head strong{font-family:var(--display);font-size:17px}
.goal .bar{height:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;background:var(--c)}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.pct{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
.tab{background:none;border:0;padding:12px 4px 14px;font:700 13px var(--body);color:var(--muted);cursor:pointer;border-top:3px solid transparent}
.tab[aria-selected="true"]{color:var(--fg);border-top-color:var(--gold)}
.sheet-bg{position:fixed;inset:0;background:rgba(10,6,14,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:90%;overflow:auto}
.sheet h3{font-family:var(--display);font-size:20px;margin:0}
label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
input,select{font:500 16px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
.inline{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--fg);font-weight:600}
.inline input{width:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.status{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media (max-width:380px){.tiles{grid-template-columns:1fr 1fr}.big{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s ease}}
</style>

<div class="wrap">
  <div class="top"><h1>Caixa da Laise</h1><small id="sync">conectando…</small></div>
  <nav class="months" id="months" aria-label="Mês"></nav>
  <main id="view"></main>
</div>
<nav class="tabs" role="tablist"><div>
  <button class="tab" role="tab" id="tab-contas" data-tab="contas">Contas</button>
  <button class="tab" role="tab" id="tab-revs" data-tab="revs">Entradas</button>
  <button class="tab" role="tab" id="tab-meta" data-tab="meta">Metas</button>
  <button class="tab" role="tab" id="tab-saldos" data-tab="saldos">Saldos</button>
</div></nav>
<div id="gate" class="sheet-bg" hidden style="align-items:center"><form class="sheet" id="login-form" style="border-radius:20px;max-width:380px" onsubmit="return false">
  <h3 style="text-align:center">Caixa da Laise</h3><p class="note" id="gate-msg" style="margin:0;text-align:center">Entre para ver suas contas.</p>
  <label for="login-email">E-mail<input id="login-email" type="email" autocomplete="username" value="laisesilvabarros@gmail.com" required></label>
  <label for="login-senha">Senha<input id="login-senha" type="password" autocomplete="current-password" required></label>
  <button class="btn primary" id="login" type="submit" style="padding:12px 20px">Entrar</button></form></div>
<div id="sheet-root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
const brl = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const brl2 = v => (Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const today = new Date(); today.setHours(0,0,0,0);
const curKey = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0');
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseISO = s => { const [y,m,d]=String(s||'').split('-').map(Number); return y?new Date(y,m-1,d):null; };
const fmtDate = s => { const d=parseISO(s); return d? String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0') : '—'; };
const monthName = k => { const [y,m]=k.split('-').map(Number); return MES[m-1]; };
const shortMonth = k => monthName(k).slice(0,3) + (k.slice(0,4)!==String(today.getFullYear())?'/'+k.slice(2,4):'');

let store = { meses:{}, semanas:[], hist:[], config:{pct:0.6, fornecedor:8000, reserva:2000}, saldos:null };
const CONTAS_BANCO=['Santander PF','Santander PJ','C6 PF','C6 PJ','XP','Nubank'];
const CONTAS_PJ=['Santander PJ','C6 PJ'], CONTAS_PF=['Santander PF','C6 PF','XP','Nubank'];
let ui = { tab:'contas', mes:null, armed:null };
try{ ui.tab = localStorage.getItem('caixa.tab') || 'contas'; }catch(e){}
let db = null;
const queues = {};
function write(path, fn){ // one write at a time per document
  queues[path] = (queues[path]||Promise.resolve()).then(fn).catch(e=>{ setSync('não salvou: '+(e&&e.code||'erro')); });
  return queues[path];
}
function setSync(t){ document.getElementById('sync').textContent=t; }

/* ---------- derived ---------- */
function isLate(c, mk){
  if(c.pago) return false;
  if(c.atrasada) return true;
  if(mk < curKey) return true;
  if(mk === curKey && c.dia && c.dia < today.getDate()) return true;
  return false;
}
function daysUntil(c, mk){
  if(!c.dia) return null;
  const [y,m]=mk.split('-').map(Number);
  return Math.round((new Date(y,m-1,c.dia)-today)/864e5);
}
function monthTotals(mk){
  const m = store.meses[mk]; if(!m) return null;
  const cs = m.contas||[];
  const sum = f => cs.filter(f).reduce((a,c)=>a+(+c.valor||0),0);
  const total = sum(()=>true), pago = sum(c=>c.pago);
  return { total, pago, falta: total-pago, pessoal: sum(c=>c.tipo!=='amei'), amei: sum(c=>c.tipo==='amei'),
           salario:+m.salario||0, precisaAmei: Math.max(0,total-(+m.salario||0)), late: cs.some(c=>isLate(c,mk)) };
}
function saldoHtml(){
  const sd=store.saldos; const v=sd&&sd.contas||{};
  const tot=CONTAS_BANCO.reduce((a,k)=>a+(+v[k]||0),0);
  const quando=sd&&sd.atualizado?`atualizado em ${fmtDate(sd.atualizado)}`:'ainda não informado';
  return `<div style="display:grid;gap:8px;padding-top:12px;border-top:1px solid var(--line)">
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="eyebrow">Dinheiro nas contas hoje</span><button class="linkbtn meta" data-act="saldos">atualizar</button></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><b style="font-family:var(--display);font-size:24px;${tot<0?'color:var(--bad)':''}">${brl2(tot)}</b><span class="meta">${quando}</span></div>
    <div class="split">${CONTAS_BANCO.map(k=>`<span>${k} <b style="${(+v[k]||0)<0?'color:var(--bad)':''}">${brl2(+v[k]||0)}</b></span>`).join('')}</div></div>`;
}
function renderSaldos(){
  const sd=store.saldos, v=(sd&&sd.contas)||{};
  const soma=arr=>arr.reduce((a,k)=>a+(+v[k]||0),0);
  const tot=soma(CONTAS_BANCO), pj=soma(CONTAS_PJ), pf=soma(CONTAS_PF);
  const max=Math.max(1,...CONTAS_BANCO.map(k=>Math.abs(+v[k]||0)));
  const linha=k=>{const x=+v[k]||0; return `<div class="row" style="grid-template-columns:minmax(0,8rem) 1fr auto"><strong style="font-weight:600">${k}</strong><div class="bar" style="height:8px"><i style="width:${Math.abs(x)/max*100}%;background:${x<0?'var(--bad)':'var(--gold)'}"></i></div><div class="val" style="${x<0?'color:var(--bad)':''}">${brl2(x)}</div></div>`;};
  const grupo=(t,arr,sub)=>`<section class="group"><h2><span>${t}</span><span>${brl2(sub)}</span></h2><div class="list">${arr.map(linha).join('')}</div></section>`;
  const mk=store.meses[curKey]?curKey:null, t=mk?metaMes(mk):null;
  const hist=[...store.hist].sort((a,b)=>String(b.id).localeCompare(String(a.id))).slice(0,8);
  return `<section class="hero"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><div class="eyebrow">Dinheiro em todas as contas</div><span class="meta">${sd&&sd.atualizado?'atualizado em '+fmtDate(sd.atualizado):'ainda não informado'}</span></div>
    <div class="big" style="${tot<0?'color:var(--bad)':''}">${brl2(tot)}</div>
    <div class="split"><span>Amei (PJ) <b style="color:var(--amei)">${brl2(pj)}</b></span><span>Pessoal (PF) <b>${brl2(pf)}</b></span></div>
    ${t?`<div class="gap-line ${tot>=t.falta8?'okay':''}"><span>Falta pagar até ${'08/'+curKey.slice(5,7)}</span><span>${tot>=t.falta8?'Coberto':'Faltam '+brl(t.falta8-tot)}</span></div>`:''}
    <button class="btn primary" data-act="saldos" style="justify-self:start">Atualizar saldos</button></section>
  ${grupo('Amei Semijoias (PJ)',CONTAS_PJ,pj)}
  ${grupo('Pessoal (PF)',CONTAS_PF,pf)}
  ${hist.length?`<section class="group"><h2><span>Histórico</span></h2><div class="list">${hist.map(h=>{const c=h.contas||{};const T=CONTAS_BANCO.reduce((a,k)=>a+(+c[k]||0),0);return `<div class="row" style="grid-template-columns:1fr auto auto;gap:14px"><strong style="font-weight:600">${fmtDate(h.id)}</strong><span class="meta">PJ ${brl(CONTAS_PJ.reduce((a,k)=>a+(+c[k]||0),0))} · PF ${brl(CONTAS_PF.reduce((a,k)=>a+(+c[k]||0),0))}</span><div class="val">${brl2(T)}</div></div>`;}).join('')}</div></section>`:''}
  <p class="note"><label for="import-file" class="linkbtn" style="display:inline">Importar dados (só na primeira vez)</label><input id="import-file" type="file" accept=".json" hidden></p>
  <p class="note">Toda segunda os saldos são atualizados pelos extratos. Atualize aqui quando quiser ver no meio da semana.</p>`;
}
function saldosSheet(){
  const v=(store.saldos&&store.saldos.contas)||{};
  sheet(`<h3>Saldo de cada conta</h3><p class="note" style="margin:0">Use sinal de menos se estiver no cheque especial.</p>
    <div class="two">${CONTAS_BANCO.map((k,i)=>`<label for="sd-${i}">${k}<input id="sd-${i}" type="number" step="0.01" inputmode="decimal" value="${v[k]??''}" placeholder="0,00"></label>`).join('')}</div>
    <div class="actions"><button class="btn primary" data-act="save-saldos">Salvar</button><button class="btn" data-act="close">Cancelar</button></div>`);
}
function entradasMes(mk){
  let total=0, revs=0, outros=0;
  for(const w of store.semanas){ if(String(w.inicio||'').slice(0,7)!==mk) continue;
    const r=(w.revendedoras||[]).reduce((a,x)=>a+(+x.valor||0),0); revs+=r; outros+=+w.outros||0; total+= (w.totalAmei!=null? +w.totalAmei : r+(+w.outros||0)); }
  return {total, revs, outros};
}

/* ---------- render ---------- */
function render(){
  const keys = Object.keys(store.meses).sort();
  if(!ui.mes || !store.meses[ui.mes]) ui.mes = keys.includes(curKey) ? curKey : (keys[0]||null);
  document.getElementById('months').innerHTML = (ui.tab!=='revs' && ui.tab!=='saldos' && keys.length) ? keys.map(k=>{
    const t = monthTotals(k);
    return `<button class="chip" data-mes="${k}" aria-pressed="${k===ui.mes}">${shortMonth(k)}${t&&t.late?'<span class="dot" title="tem conta atrasada"></span>':''}</button>`;
  }).join('') : '';
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected', b.dataset.tab===ui.tab));
  const v = document.getElementById('view');
  if(ui.tab==='contas') v.innerHTML = renderContas();
  else if(ui.tab==='revs') v.innerHTML = renderEntradas();
  else if(ui.tab==='saldos') v.innerHTML = renderSaldos();
  else v.innerHTML = renderMeta();
}

function renderContas(){
  const mk = ui.mes;
  if(!mk) return `<div class="empty" style="margin-top:12px"><strong>Suas contas aparecem aqui</strong>Cada mês mostra o que vence, o que está atrasado e quanto falta pagar. ${db?'Os dados estão carregando.':'Abra esta página no claude.ai para ver seus dados.'}</div>`;
  const m = store.meses[mk], t = monthTotals(mk), cs = (m.contas||[]).map((c,i)=>({...c,_i:i}));
  const pctPago = t.total? t.pago/t.total*100 : 0;
  const late = cs.filter(c=>isLate(c,mk)).sort((a,b)=>(a.dia||0)-(b.dia||0));
  const open = cs.filter(c=>!c.pago && !isLate(c,mk));
  const soon = open.filter(c=>{const d=daysUntil(c,mk); return d!==null && d<=7;}).sort((a,b)=>a.dia-b.dia);
  const later = open.filter(c=>{const d=daysUntil(c,mk); return d!==null && d>7;}).sort((a,b)=>a.dia-b.dia);
  const nodate = open.filter(c=>!c.dia);
  const paid = cs.filter(c=>c.pago);
  const fecha = t.salario - t.total;
  const grp = (title, arr, cls='') => arr.length ? `<section class="group ${cls}"><h2><span>${title}</span><span>${brl(arr.reduce((a,c)=>a+(+c.valor||0),0))}</span></h2><div class="list">${arr.map(c=>rowConta(c,mk)).join('')}</div></section>` : '';
  return `
  <section class="hero" aria-label="Resumo do mês">
    <div><div class="eyebrow">Falta pagar em ${monthName(mk)}</div><div class="big">${brl(t.falta)}</div></div>
    <div class="bar" role="img" aria-label="${Math.round(pctPago)}% pago"><i style="width:${pctPago}%;background:var(--ok)"></i></div>
    <div class="split"><span>Pago <b>${brl(t.pago)}</b> de <b>${brl(t.total)}</b></span><span>·</span><span>Pessoal <b>${brl(t.pessoal)}</b></span><span>Amei <b style="color:var(--amei)">${brl(t.amei)}</b></span></div>
    <div class="gap-line ${fecha>=0?'okay':''}"><span>Salário <button class="linkbtn" data-act="salario">${brl(t.salario)}</button></span><span>${fecha>=0?'Sobra '+brl(fecha):'A Amei precisa trazer '+brl(-fecha)}</span></div>
    ${saldoHtml()}
  </section>
  ${grp('Atrasadas', late, 'late')}
  ${grp('Vence nos próximos 7 dias', soon)}
  ${grp('Mais para frente', later)}
  ${grp('Sem dia fixo', nodate)}
  ${grp('Pagas', paid)}
  <button class="add" data-act="nova-conta">+ Adicionar conta em ${monthName(mk)}</button>`;
}
function rowConta(c, mk){
  const late = isLate(c,mk), d = daysUntil(c,mk);
  let when = c.dia ? `dia ${c.dia}` : 'sem dia fixo';
  if(c.nota) when = esc(c.nota);
  else if(!c.pago && d!==null && mk===curKey){ if(d===0) when='vence hoje'; else if(d>0 && d<=7) when=`vence em ${d} ${d===1?'dia':'dias'}`; }
  return `<div class="row ${c.pago?'paid':''} ${late?'late':''}">
    <button class="check" data-act="toggle" data-i="${c._i}" aria-pressed="${!!c.pago}" aria-label="Marcar ${esc(c.nome)} como ${c.pago?'não paga':'paga'}">✓</button>
    <div class="name" data-act="edit-conta" data-i="${c._i}"><strong>${esc(c.nome)}</strong>
      <div class="meta">${c.tipo==='amei'?'<span class="tag amei">Amei</span>':'<span class="tag">Pessoal</span>'}${late?'<span class="tag bad">atrasada</span>':''}<span>${when}</span></div></div>
    <div class="val">${brl2(c.valor)}</div></div>`;
}

function renderEntradas(){
  const ws=[...store.semanas].sort((a,b)=>String(b.inicio).localeCompare(String(a.inicio)));

  const tiles = `<div class="tiles">
    <div class="tile"><div class="eyebrow">Amei recebeu em ${mn}</div><div class="n">${brl(t.total)}</div></div>
    <div class="tile"><div class="eyebrow">De revendedoras</div><div class="n">${brl(t.revs)}</div></div>
    <div class="tile"><div class="eyebrow">Clientes e outros</div><div class="n">${brl(t.outros)}</div></div></div>`;
  if(!ws.length) return tiles + `<div class="empty" style="margin-top:14px"><strong>As entradas aparecem aqui toda segunda</strong>Quando você enviar os extratos, eu separo o que entrou na conta da Amei: acertos das revendedoras e pagamentos de clientes. Você não precisa lançar nada aqui. O controle de cada revendedora continua no seu sistema.</div>`;
  return tiles + ws.map(w=>{
    const rs=[...(w.revendedoras||[])].sort((a,b)=>(+b.valor||0)-(+a.valor||0));

    const bar=(nome,v,c)=>`<div style="display:grid;grid-template-columns:minmax(0,9rem) 1fr auto;gap:10px;align-items:center;font-size:13px"><span style="overflow-wrap:anywhere">${esc(nome)}</span><div class="bar" style="height:8px"><i style="width:${(+v||0)/max*100}%;background:${c}"></i></div><b>${brl(v)}</b></div>`;
    return `<section class="group"><h2><span>Semana de ${fmtDate(w.inicio)} a ${fmtDate(w.fim)}</span><span>${brl(w.totalAmei!=null?w.totalAmei:rs.reduce((a,x)=>a+(+x.valor||0),0)+(+w.outros||0))}</span></h2>
      <div class="card">${rs.map(x=>bar(x.nome,x.valor,'var(--gold)')).join('')}${+w.outros?bar('Clientes e outros',w.outros,'var(--amei)'):''}
      ${!rs.length&&!+w.outros?'<span class="meta">Nenhuma entrada na Amei nesta semana.</span>':''}
      ${w.observacao?`<div class="note" style="margin:0">${esc(w.observacao)}</div>`:''}</div></section>`;
  }).join('');
}

function metaMes(mk){
  const m=store.meses[mk]; if(!m) return null;
  const cfg=store.config, pct=+cfg.pct||0.6, forn=+cfg.fornecedor||0, res=+cfg.reserva||0;
  const cs=(m.contas||[]).filter(c=>!c.pago || true);
  const early=c=>c.atrasada || (c.dia && c.dia<=14);
  const sum=f=>cs.filter(f).reduce((a,c)=>a+(+c.valor||0),0);
  const ameiTot=sum(c=>c.tipo==='amei'), ameiEarly=sum(c=>c.tipo==='amei'&&early(c));
  const pesEarly=sum(c=>c.tipo!=='amei'&&early(c));
  const pesTot=sum(c=>c.tipo!=='amei');
  const pl = m.prolabore!=null ? +m.prolabore : Math.max(0,pesTot-(+m.salario||0));
  const p1=Math.min(pl,pesEarly), p2=Math.max(0,pl-p1);
  const ate8=ameiEarly+p1+forn/2, ate22=(ameiTot-ameiEarly)+p2+forn/2+res;
  const receber=ate8+ate22;
  const entrou=entradasMes(mk);
  const e8=store.semanas.filter(w=>String(w.inicio||'').slice(0,7)===mk && +String(w.inicio).slice(8,10)<=8).reduce((a,w)=>a+(+w.totalAmei||0),0);
  const lst=f=>cs.filter(f).map(c=>({nome:c.nome,valor:+c.valor||0,dia:c.dia,nota:c.atrasada?(c.nota||'atrasada'):'',pago:!!c.pago}));
  const listas={
    a8:lst(c=>c.tipo==='amei'&&early(c)), p8:lst(c=>c.tipo!=='amei'&&early(c)),
    a22:lst(c=>c.tipo==='amei'&&!early(c)), p22:lst(c=>c.tipo!=='amei'&&!early(c))};
  const pg=a=>a.filter(c=>c.pago).reduce((x,c)=>x+c.valor,0);
  const pago8=pg(listas.a8)+pg(listas.p8), pago22=pg(listas.a22)+pg(listas.p22);
  const falta8=Math.max(0,ate8-pago8), falta22=Math.max(0,ate22-pago22);
  return {pct,forn,res,ameiTot,pl,p1,p2,ate8,ate22,pago8,pago22,falta8,falta22,receber,vender:receber/pct,entrou:entrou.total,e8,listas,pesEarly,
          sobraPessoal:(+m.salario||0)+pl-pesTot, salario:+m.salario||0, pesTot};
}
function renderMeta(){

  const line=(n,v,extra='')=>`<div class="row" style="grid-template-columns:1fr auto"><div class="name" style="cursor:default"><strong>${n}</strong>${extra}</div><div class="val">${brl(v)}</div></div>`;
  const others=keys.map(k=>{const x=metaMes(k);return `<tr${k===mk?' style="font-weight:700"':''}><td>${monthName(k).slice(0,3)}</td><td>${brl(x.vender)}</td><td>${brl(x.receber)}</td><td>${brl(x.ate8)}</td><td>${brl(x.ate22)}</td><td>${brl(x.pl)}</td></tr>`;}).join('');
  return `<section class="hero" aria-label="Meta do mês">
    <div class="eyebrow">Meta de ${mn}</div>
    <div class="two" style="gap:14px">
      <div><div class="meta">Vender</div><div class="big" style="font-size:34px">${brl(t.vender)}</div></div>
      <div><div class="meta">Receber das revendedoras e clientes</div><div class="big" style="font-size:34px;color:var(--gold)">${brl(t.receber)}</div></div>
    </div>
    <div class="bar" role="img" aria-label="Entrou ${brl(t.entrou)} de ${brl(t.receber)}"><i style="width:${prog}%;background:var(--gold)"></i></div>
    <div class="split"><span>Já entrou na Amei <b>${brl(t.entrou)}</b></span><span>Falta <b>${brl(Math.max(0,t.receber-t.entrou))}</b></span></div>
  </section>
  <section class="group"><h2><span>Quando precisa receber</span></h2>
    <div class="tiles" style="grid-template-columns:1fr 1fr">
      ${ms('08',t.ate8,t.falta8,t.pago8,'Contas dos dias 9 a 14 e atrasadas')}
      ${ms('22',t.ate22,t.falta22,t.pago22,'Do dia 15 em diante, fornecedor e reserva')}
    </div>
    <p class="note" style="font-weight:700;color:var(--fg)">Hoje nas contas: ${brl2(CONTAS_BANCO.reduce((a,k)=>a+(+((store.saldos&&store.saldos.contas)||{})[k]||0),0))}. Falta receber até o dia 8: ${brl2(Math.max(0,t.falta8-CONTAS_BANCO.reduce((a,k)=>a+(+((store.saldos&&store.saldos.contas)||{})[k]||0),0)))}.</p>
    <p class="note">Marque os acertos das revendedoras para cair até essas datas. O dia 8 é o mais importante: entre os dias 9 e 12 vence quase tudo.</p></section>
  <section class="group"><h2><span>Para onde vai o que entra</span><span>${brl(t.receber)}</span></h2><div class="list">
    ${line('Contas da Amei',t.ameiTot,'<div class="meta">Cartão XP, Santander, Crediamigo, Livia</div>')}
    ${line('Fornecedor (novidades)',t.forn)}
    ${line('Seu pró-labore',t.pl,`<div class="meta"><button class="linkbtn" data-act="prolabore">mudar</button> · Pix da PJ para você: ${brl(t.p1)} até dia 8${t.p2?` e ${brl(t.p2)} até dia 22`:''}</div>`)}
    ${line('Reserva da Amei',t.res)}
  </div>
  <p class="note">${t.sobraPessoal>=0?`Com esse pró-labore e o salário de ${brl(t.salario)}, sobram ${brl(t.sobraPessoal)} no pessoal depois de todas as suas contas.`:`Esse pró-labore não cobre suas contas pessoais: faltam ${brl(-t.sobraPessoal)}.`}</p></section>

    <tbody>${others.replace(/<td>/g,'<td style="padding:8px 4px;border-top:1px solid var(--line)">').replace(/<tr([^>]*)><td style="/g,'<tr$1><td style="padding-left:12px;')}</tbody></table></div></section>
  <section class="group"><h2><span>Ajustes</span></h2><div class="card">
    <label for="pct" class="inline" style="justify-content:space-between">De cada R$ 100 vendidos, entram para você (%)<input id="pct" data-cfg="pct" type="number" min="1" max="100" value="${Math.round(t.pct*100)}" style="width:90px"></label>

    <label for="cfg-res" class="inline" style="justify-content:space-between">Reserva da Amei por mês (R$)<input id="cfg-res" data-cfg="reserva" type="number" min="0" step="100" value="${t.res}" style="width:110px"></label>
  </div></section>`;
}

function detalheSheet(w){
  const t=metaMes(ui.mes), mm=ui.mes.slice(5,7);
  const item=(n,v,sub='',neg=false,done=false)=>`<div class="row ${done?'paid':''}" style="grid-template-columns:1fr auto;padding:9px 12px"><div class="name" style="cursor:default"><strong style="font-weight:600">${esc(n)}</strong>${sub?`<div class="meta">${sub}</div>`:''}</div><div class="val" style="${neg?'color:var(--ok)':''}">${neg?'−':''}${brl2(v)}</div></div>`;
  const conta=c=>item(c.nome,c.valor,[c.nota&&!c.pago?`<span class="tag bad">${esc(c.nota)}</span>`:'',c.dia?`dia ${c.dia}`:'',c.tipo==='amei'?'<span class="tag amei">Amei</span>':''].filter(Boolean).join(' '),false,c.pago);
  const sum=a=>a.reduce((x,c)=>x+c.valor,0);
  const bloco=(titulo,linhas,total,cls='')=>linhas?`<section class="group ${cls}" style="margin-top:6px"><h2><span>${titulo}</span><span>${brl2(total)}</span></h2><div class="list">${linhas}</div></section>`:'';
  const tag=(arr,tipo)=>arr.map(c=>({...c,tipo}));
  let todas, extras='', total, falta, pago;
  if(w==='08'){
    todas=[...tag(t.listas.a8,'amei'),...tag(t.listas.p8,'pessoal')];
    total=t.ate8; falta=t.falta8; pago=t.pago8;
    const naoCob=sum(t.listas.p8)-t.p1;
    extras=item('Fornecedor (1ª metade)',t.forn/2,'compra de novidades')+(naoCob>0?item('Pró-labore não cobre',naoCob,'essas contas pessoais passam do pró-labore do mês',true):'');
  } else {
    todas=[...tag(t.listas.a22,'amei'),...tag(t.listas.p22,'pessoal')];
    total=t.ate22; falta=t.falta22; pago=t.pago22;
    const P=sum(t.listas.p22), sal=Math.min(t.salario,P), sobra=t.p2-(P-sal);
    extras=item('Fornecedor (2ª metade)',t.forn/2,'compra de novidades')+item('Reserva da Amei',t.res,'guardar na conta PJ')
      +item('Salário (cai dia 25)',sal,'paga parte das suas contas',true)
      +(sobra>0?item('Sobra do pró-labore',sobra,'fica livre para você'):'')+(sobra<0?item('Pró-labore não cobre',-sobra,'aumente o pró-labore',true):'');
  }
  const abertas=todas.filter(c=>!c.pago), pagas=todas.filter(c=>c.pago);
  sheet(`<h3>Até ${w}/${mm}</h3>
    <div class="tiles" style="grid-template-columns:1fr 1fr 1fr;margin:0">
      <div class="tile"><div class="eyebrow">Falta</div><div class="n" style="color:${falta>0?'var(--bad)':'var(--ok)'}">${brl(falta)}</div></div>
      <div class="tile"><div class="eyebrow">Já pago</div><div class="n" style="color:var(--ok)">${brl(pago)}</div></div>
      <div class="tile"><div class="eyebrow">Total</div><div class="n">${brl(total)}</div></div></div>
    ${bloco('Falta pagar',abertas.map(conta).join('')+extras,falta,'late')}
    ${bloco('Já pago',pagas.map(conta).join(''),pago)}
    <p class="note" style="margin:0">Para marcar uma conta como paga, toque na bolinha dela na aba Contas.</p>
    <div class="actions"><button class="btn primary" data-act="close">Fechar</button></div>`);
}

/* ---------- writes ---------- */
function saveMonth(mk){
  const m = store.meses[mk]; render();
  if(!db) return;
  setSync('salvando…');
  write('meses/'+mk, ()=>db.doc('meses/'+mk).update({contas:m.contas, salario:m.salario, ...(m.prolabore!=null?{prolabore:m.prolabore}:{})}).then(()=>setSync('salvo')));
}

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act],[data-mes],[data-tab]'); if(!t) return;
  if(t.classList.contains('sheet-bg') && e.target!==t) return;
  if(t.dataset.tab){ ui.tab=t.dataset.tab; try{localStorage.setItem('caixa.tab',ui.tab)}catch(_){}; render(); window.scrollTo(0,0); return; }
  if(t.dataset.mes){ ui.mes=t.dataset.mes; render(); return; }
  const a = t.dataset.act, m = store.meses[ui.mes];
  if(a==='close'){ closeSheet(); return; }
  if(a==='toggle'){ const c=m.contas[+t.dataset.i]; c.pago=!c.pago; saveMonth(ui.mes); return; }
  if(a==='edit-conta'){ contaSheet(+t.dataset.i); return; }
  if(a==='nova-conta'){ contaSheet(null); return; }
  if(a==='salario'){ salarioSheet(); return; }
  if(a==='saldos'){ saldosSheet(); return; }
  if(a==='save-saldos'){ const c={}; CONTAS_BANCO.forEach((k,i)=>{ c[k]=+val('sd-'+i)||0; }); store.saldos={contas:c, atualizado:iso(today)}; closeSheet(); render();
    if(db){ setSync('salvando…'); write('saldos/atual',()=>db.doc('saldos/atual').set(store.saldos).then(()=>db.doc('saldos_hist/'+store.saldos.atualizado).set(store.saldos)).then(()=>setSync('salvo'))); } return; }
  if(a==='detalhe'){ detalheSheet(t.dataset.w); return; }
  if(a==='prolabore'){ prolaboreSheet(); return; }
  if(a==='save-prolabore'){ const v=+val('pl-val')||0; const all=document.getElementById('pl-todos').checked; closeSheet();
    for(const k of Object.keys(store.meses).filter(k=>k===ui.mes||(all&&k>ui.mes))){ store.meses[k].prolabore=v; saveMonth(k); } return; }
  if(a==='save-salario'){ m.salario=+val('s-val')||0; closeSheet(); saveMonth(ui.mes); return; }
  if(a==='save-conta'){
    const nome=(val('f-nome')||'').trim(); if(!nome){ document.getElementById('f-nome').focus(); return; }
    const data={nome, valor:+val('f-valor')||0, dia:+val('f-dia')||null, tipo:val('f-tipo'), atrasada:document.getElementById('f-atr').checked};
    const i=t.dataset.i;
    if(i===''){ m.contas.push({...data, id:'c'+Date.now().toString(36), pago:false}); }
    else {
      const old=m.contas[+i]; Object.assign(old,data);
      if(document.getElementById('f-todos')?.checked){
        for(const k of Object.keys(store.meses).filter(k=>k>ui.mes)){
          const c=(store.meses[k].contas||[]).find(x=>x.id===old.id);
          if(c){ Object.assign(c,{nome:data.nome,valor:data.valor,dia:data.dia,tipo:data.tipo}); saveMonth(k); }
        }
      }
    }
    closeSheet(); saveMonth(ui.mes); return;
  }
  if(a==='del-conta'){
    if(ui.armed!==a){ ui.armed=a; t.classList.add('armed'); t.textContent='Toque de novo para excluir'; return; }
    m.contas.splice(+t.dataset.i,1); closeSheet(); saveMonth(ui.mes); return;
  }
});
let cfgTimer;
document.addEventListener('input', e=>{
  const key=e.target.dataset?.cfg; if(!key) return;
  let v=+e.target.value; if(!isFinite(v)) return;
  if(key==='pct') v=Math.min(100,Math.max(1,v||60))/100; else v=Math.max(0,v);
  store.config[key]=v;
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(()=>{ const id=e.target.id; render(); const el=document.getElementById(id); if(el) el.focus();
    if(db) write('config/geral', ()=>db.doc('config/geral').set({pct:store.config.pct, fornecedor:store.config.fornecedor, reserva:store.config.reserva}).then(()=>setSync('salvo'))); }, 700);
});

/* ---------- boot ---------- */
render();
const LAISE_EMAIL='laisesilvabarros@gmail.com'; const LAISE_UID=(window.FIREBASE_CONFIG||{}).laiseUid||'';
function start(){
  if(!window.firebase || !(window.FIREBASE_CONFIG||{}).apiKey){ setSync('falta configurar o Firebase'); return; }
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth=firebase.auth();
  auth.onAuthStateChanged(u=>{
    const gate=document.getElementById('gate');
    if(!u){ gate.hidden=false; setSync('entre para ver'); return; }
    if((u.email||'').toLowerCase()!==LAISE_EMAIL || (LAISE_UID && u.uid!==LAISE_UID)){ gate.hidden=false; document.getElementById('gate-msg').textContent='Esta conta não tem acesso. Entre com '+LAISE_EMAIL+'.'; auth.signOut(); return; }
    gate.hidden=true; connect();
  });
  document.getElementById('login-form').onsubmit=e=>{ e.preventDefault();
    const msg=document.getElementById('gate-msg'); msg.textContent='Entrando…';
    auth.signInWithEmailAndPassword(document.getElementById('login-email').value.trim(), document.getElementById('login-senha').value)
      .catch(x=>{ msg.textContent = /wrong-password|invalid-credential|user-not-found|invalid-login/.test(x.code||'') ? 'E-mail ou senha errados.' : 'Não entrou ('+(x.code||'erro')+').'; });
    return false; };
}
let connected=false;
function connect(){
  if(connected) return; connected=true;
  db=firebase.firestore();
  try{ db.enablePersistence({synchronizeTabs:true}).catch(()=>{}); }catch(_){}
  setSync('carregando…');
  const err = e => setSync('erro ao carregar ('+(e&&e.code||'?')+')');
  db.collection('meses').onSnapshot(s=>{ const o={}; s.docs.forEach(d=>{ o[d.id]=JSON.parse(JSON.stringify(d.data())); if(!o[d.id].contas) o[d.id].contas=[]; }); store.meses=o; setSync(s.metadata.fromCache?'offline (salvo no aparelho)':'atualizado'); if(!document.getElementById('sheet-form')) render(); }, err);
  db.collection('semanas').onSnapshot(s=>{ store.semanas=s.docs.map(d=>({id:d.id, ...JSON.parse(JSON.stringify(d.data()))})); if(!document.getElementById('sheet-form')) render(); }, err);
  db.collection('saldos_hist').onSnapshot(q=>{ store.hist=q.docs.map(d=>({id:d.id,...JSON.parse(JSON.stringify(d.data()))})); if(ui.tab==='saldos'&&!document.getElementById('sheet-form')) render(); }, err);
  db.doc('saldos/atual').onSnapshot(d=>{ store.saldos=d.exists?JSON.parse(JSON.stringify(d.data())):null; if(!document.getElementById('sheet-form')) render(); }, err);
  db.doc('config/geral').onSnapshot(d=>{ if(d.exists){ store.config={...store.config, ...d.data()}; if(!document.activeElement?.dataset?.cfg) render(); } }, err);
}
/* Importar dados (uma vez): escolha o arquivo dados-painel.json */
document.addEventListener('change', async e=>{
  if(e.target.id!=='import-file') return;
  const f=e.target.files[0]; if(!f||!db) return;
  try{
    const data=JSON.parse(await f.text()); let n=0;
    for(const [col,docs] of Object.entries(data)) for(const [id,body] of Object.entries(docs)){ await db.collection(col).doc(id).set(body); n++; }
    setSync(n+' registros importados');
  }catch(x){ setSync('não importou: '+(x.message||x)); }
});
start();</script>
